name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/training/archives
          key: training-archives-${{ runner.os }}-${{ hashFiles('training-data.lock.json') }}
          restore-keys: |
            training-archives-${{ runner.os }}-
      # Explicit verified prepared-data retrieval. Cache hits are rehashed too.
      # Initial bootstrap deliberately fails until the owner publishes/pins real URLs.
      - run: npm run data:hydrate
      - run: npm run data:check
      - run: REQUIRE_TRAINING_DATA=1 npm test
      # Offline frozen allowlist, current+previous retention, complete validation/budgets.
      # No Python, Stockfish, raw Lichess download, or release publication here.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Desktop/mobile correctness and controlled cold-load budgets
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-check-reports
          path: |
            data/training/measurements
            test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
