[project]
name = "chess-puzzle-not-puzzle"
version = "0.1.0"
description = "Chess training without knowing whether there is a tactic."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "python-chess>=1.999,<2",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
